name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar carpeta android
        run: |
          flutter create --platforms=android --org bo.ayni --project-name ayniapp _gen
          cp -r _gen/android ./android
          rm -rf _gen
          sed -i 's/android:label="[^"]*"/android:label="AyniApp"/' android/app/src/main/AndroidManifest.xml
                    sed -i 's#</application>#    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n</application>#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: AyniApp-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AyniApp v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
